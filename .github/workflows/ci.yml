name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancela execuções antigas do mesmo PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  governanca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório com o histórico completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar o Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A BASE_REF fica só nas duas etapas abaixo: a action do gitleaks também lê essa variável.
      # PR em rascunho: nível push. PR pronto para revisão: nível pronto.
      - name: Documentação viva
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/verificar-docs.mjs --nivel=${{ github.event.pull_request.draft && 'push' || 'pronto' }}

      - name: Autoria dos commits e do PR
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/verificar-autoria.mjs

      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Instalar o Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Lint e formatação
        run: npm run lint

      - name: Testes com cobertura
        run: npm run test:cobertura

      - name: Guardar a cobertura para o Sonar
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error

      - name: Build
        run: npm run build

      - name: Auditoria das dependências
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    # Usuário e senha só do banco descartável do CI (os mesmos do .env.example).
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: volleypro_teste
      DB_USERNAME: volleypro
      DB_PASSWORD: volleypro
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: volleypro
          POSTGRES_PASSWORD: volleypro
          POSTGRES_DB: volleypro_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volleypro -d volleypro_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Instalar o PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: pcov

      - name: Instalar as dependências
        run: composer --working-dir=backend install --no-interaction --prefer-dist

      - name: Preparar o ambiente
        run: |
          cp backend/.env.example backend/.env
          php backend/artisan key:generate

      - name: Estilo (Pint)
        run: composer --working-dir=backend lint

      - name: Análise estática (Larastan)
        run: composer --working-dir=backend analise

      - name: Testes com cobertura
        run: composer --working-dir=backend test -- --coverage --coverage-clover=coverage/clover.xml

      - name: Guardar a cobertura para o Sonar
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/clover.xml
          if-no-files-found: error

      - name: Auditoria das dependências
        run: composer --working-dir=backend audit

  # Analise no SonarQube Cloud: so roda quando o dono cadastrou o segredo SONAR_TOKEN.
  # Sem o segredo (ou em PR de fork), as etapas sao puladas e o job termina verde.
  # O contexto secrets nao pode ser usado no if; por isso ele passa pela variavel de ambiente.
  sonar:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Baixar o repositório com o histórico completo
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Baixar a cobertura do frontend
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

      - name: Baixar a cobertura do backend
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage

      - name: Analisar no SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sem SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN nao cadastrado - analise do Sonar pulada."
