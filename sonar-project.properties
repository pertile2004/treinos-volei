# SonarQube Cloud (PR-28). Roda no CI so quando o segredo SONAR_TOKEN existe (job sonar).
# Chave e organizacao sao as padrao da importacao do repositorio pertile2004/treinos-volei;
# nao sao segredo. O dono do repositorio confirma os valores ao criar o projeto no SonarQube Cloud.
sonar.projectKey=pertile2004_treinos-volei
sonar.organization=pertile2004
sonar.projectName=VOLLEY PRO

sonar.sources=backend/app,backend/bootstrap,backend/config,backend/routes,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,backend/tests/**
sonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/coverage/**,backend/database/migrations/**,frontend/src/testes/**
sonar.sourceEncoding=UTF-8

# Relatorios de cobertura gerados pelos jobs backend (Pest, clover) e frontend (Vitest, lcov).
sonar.php.coverage.reportPaths=backend/coverage/clover.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
